name: CI

# Compuerta minima: si el proyecto no instala y no construye, el PR no entra.
#
# `npm install` y no `npm ci`, a proposito: Vercel construye con `npm install`, asi que la
# compuerta instala igual que produccion. El 2026-11-05 un bump llego verde al CI y rompio un
# build de produccion con ERESOLVE; por eso la compuerta replica el instalador real.
#
# Correccion del 2026-11-07: este comentario afirmaba que `npm ci` "tolera un arbol de peers
# incoherente". Es falso. Con react 19 y react-dom 18.3.1 en el lockfile, `npm ci` sale
# ERESOLVE igual que `npm install` (verificado en npm 10 y en npm 11). La diferencia real es
# otra: `npm ci` aborta con EUSAGE si el lockfile no cuadra con el package.json, mientras
# `npm install` los reconcilia y reescribe el lockfile.
#
# `workflow_dispatch` existe para poder comprobar esta compuerta en la rama por defecto
# antes de declararla check requerido: un check requerido que nunca se vio verde bloquea
# todos los merges del repo.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar como instala Vercel
        run: npm install --no-audit --no-fund

      - name: Construir
        run: npm run build
